<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물품 등록 - 한글학교 나눔 광장</title>
    <style>
        :root {
            --primary: #E91E63;
            --bg: #F5F7FA;
            --white: #FFFFFF;
            --text: #1A1A1A;
            --gray: #666666;
            --border: #E0E0E0;
            --success: #4CAF50;
            --error: #F44336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .form-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .required::after {
            content: " *";
            color: var(--error);
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Image Upload */
        .image-upload {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #FAFAFA;
        }

        .image-upload:hover {
            border-color: var(--primary);
            background: #FFF0F5;
        }

        .image-upload.has-image {
            border-style: solid;
            border-color: var(--success);
            background: #E8F5E9;
        }

        .image-upload input {
            display: none;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-text {
            color: var(--gray);
        }

        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            margin-top: 12px;
        }

        .remove-image {
            margin-top: 12px;
            padding: 8px 16px;
            background: #FFEBEE;
            border: none;
            border-radius: 8px;
            color: var(--error);
            cursor: pointer;
            font-weight: 600;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .submit-btn:disabled {
            background: #CCC;
            cursor: not-allowed;
            transform: none;
        }

        /* Status */
        .status {
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            display: none;
        }

        .status.loading {
            display: block;
            background: #E3F2FD;
            color: #1976D2;
        }

        .status.success {
            display: block;
            background: #E8F5E9;
            color: #388E3C;
        }

        .status.error {
            display: block;
            background: #FFEBEE;
            color: #D32F2F;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #1976D2;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .hint {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📦 물품 등록</h1>
            <p>나눔/교환할 물품을 등록해주세요</p>
        </div>

        <form id="itemForm" class="form-body">
            <!-- 물품명 -->
            <div class="form-group">
                <label for="title" class="required">물품명</label>
                <input type="text" id="title" name="title" placeholder="예: 2학년 수학 문제집" required>
            </div>

            <!-- 카테고리 -->
            <div class="form-group">
                <label for="category" class="required">카테고리</label>
                <select id="category" name="category" required>
                    <option value="">선택해주세요</option>
                    <option value="도서">📚 도서</option>
                    <option value="완구">🧸 완구</option>
                    <option value="의류">👕 의류</option>
                    <option value="생활">🏠 생활</option>
                    <option value="기타">📦 기타</option>
                </select>
            </div>

            <!-- 설명 -->
            <div class="form-group">
                <label for="description" class="required">설명</label>
                <textarea id="description" name="description" placeholder="물품 상태, 거래 조건 등을 자세히 적어주세요"
                    required></textarea>
            </div>

            <!-- 사진 -->
            <div class="form-group">
                <label>사진 (선택)</label>
                <div class="image-upload" id="imageUpload" onclick="document.getElementById('imageInput').click()">
                    <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)">
                    <div id="uploadPlaceholder">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">사진을 첨부하려면 클릭하세요</div>
                    </div>
                    <img id="imagePreview" class="image-preview" style="display: none;">
                </div>
                <button type="button" id="removeImageBtn" class="remove-image" style="display: none;"
                    onclick="removeImage()">
                    ❌ 사진 제거
                </button>
                <p class="hint">📱 휴대폰에서는 카메라로 바로 촬영도 가능해요!</p>
            </div>

            <!-- 제출 -->
            <button type="submit" class="submit-btn" id="submitBtn">등록하기</button>

            <div id="status" class="status"></div>
        </form>
    </div>

    <a href="market.html" class="back-link">← 장터로 돌아가기</a>

    <script>
        // ============== 설정 (CONFIG) ==============
        const CONFIG = {
            // 구글 폼 제출 URL
            GOOGLE_FORM_URL: "https://docs.google.com/forms/u/0/d/e/1FAIpQLSeIQnNPRJrPItps-wPfLoO17rxf8sXBru484pqzLi4xxXYW6Q/formResponse",

            // 구글 폼 Entry ID들 (정확히 매칭됨)
            ENTRY_TITLE: "entry.1880861461",       // 물품명
            ENTRY_CATEGORY: "entry.699611176",     // 카테고리
            ENTRY_DESCRIPTION: "entry.286220523",  // 설명
            ENTRY_IMAGE_URL: "entry.1319291925",   // 사진 URL

            // ImgBB API 키
            IMGBB_API_KEY: "3ebdd1088182dc26013542a02ff2e0d9"
        };

        let selectedImage = null;
        let uploadedImageUrl = "";

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedImage = file;

            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('imagePreview').style.display = 'block';
                document.getElementById('uploadPlaceholder').style.display = 'none';
                document.getElementById('imageUpload').classList.add('has-image');
                document.getElementById('removeImageBtn').style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            selectedImage = null;
            uploadedImageUrl = "";
            document.getElementById('imageInput').value = "";
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('uploadPlaceholder').style.display = 'block';
            document.getElementById('imageUpload').classList.remove('has-image');
            document.getElementById('removeImageBtn').style.display = 'none';
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            status.innerHTML = type === 'loading' ? '<span class="spinner"></span>' + message : message;
        }

        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch(`https://api.imgbb.com/1/upload?key=${CONFIG.IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('이미지 업로드 실패');

            const data = await response.json();
            return data.data.url;
        }

        async function submitToGoogleForm(title, category, description, imageUrl) {
            const formData = new FormData();
            formData.append(CONFIG.ENTRY_TITLE, title);
            formData.append(CONFIG.ENTRY_CATEGORY, category);
            formData.append(CONFIG.ENTRY_DESCRIPTION, description);
            if (imageUrl) {
                formData.append(CONFIG.ENTRY_IMAGE_URL, imageUrl);
            }

            await fetch(CONFIG.GOOGLE_FORM_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: formData
            });
        }

        document.getElementById('itemForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value.trim();

            if (!title || !category || !description) {
                showStatus('모든 필수 항목을 입력해주세요', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            try {
                // 1. 이미지 업로드 (있는 경우)
                if (selectedImage) {
                    showStatus('사진 업로드 중...', 'loading');
                    uploadedImageUrl = await uploadImageToImgBB(selectedImage);
                }

                // 2. 구글 폼 제출
                showStatus('물품 등록 중...', 'loading');
                await submitToGoogleForm(title, category, description, uploadedImageUrl);

                // 3. 완료
                showStatus('✅ 등록 완료! 잠시 후 장터에 표시됩니다.', 'success');

                // 폼 초기화
                document.getElementById('itemForm').reset();
                removeImage();

                // 3초 후 장터로 이동
                setTimeout(() => {
                    window.location.href = 'market.html';
                }, 3000);

            } catch (error) {
                console.error(error);
                showStatus('❌ 오류가 발생했습니다: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Load config and set primary color
        fetch('config.json')
            .then(res => res.json())
            .then(config => {
                if (config.defaultColor) {
                    document.documentElement.style.setProperty('--primary', config.defaultColor);
                }
            })
            .catch(() => { });
    </script>
</body>

</html>
